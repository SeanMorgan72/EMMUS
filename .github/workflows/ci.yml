name: EMMUS CI

on:
  push:
  pull_request:

jobs:

  build-and-test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [debug, release]

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Configure
        run: cmake --preset ${{ matrix.preset }}


      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel


      - name: Test
        run: ctest --preset ${{ matrix.preset }}


      - name: Install
        run: >
          cmake --install build/${{ matrix.preset }}
          --prefix ${{ runner.temp }}/emmus-install/${{ matrix.preset }}